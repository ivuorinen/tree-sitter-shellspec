---
# Code-scanning config for .github/workflows/codeql.yml. `x codeql` reads this same
# file for local runs, so local and CI results agree.
paths-ignore:
  # Generated by `tree-sitter generate`: its findings (undocumented functions, long
  # switches) cannot be fixed here, and edits are overwritten on the next generate.
  - src/parser.c
  # tree-sitter runtime headers, vendored as-is by the CLI.
  - src/tree_sitter

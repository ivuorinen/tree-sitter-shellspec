---
# Repository labels, synced by .github/workflows/sync-labels.yml.
# The sync prunes every label not listed here, so this file mirrors the labels
# the repository already had, plus `bug` and `grammar` used by .github/ISSUE_TEMPLATE/.
- name: "area/ansible"
  color: "0e8a16"
  description: "Issues or PRs related to Ansible configuration and automation."
- name: "area/docs"
  color: "0e8a16"
  description: "Issues or PRs related to documentation and guides."
- name: "area/github"
  color: "0e8a16"
  description: "Issues or PRs related to GitHub Actions and repository configuration."
- name: "area/kubernetes"
  color: "0e8a16"
  description: "Issues or PRs related to Kubernetes manifests and configuration."
- name: "area/taskfile"
  color: "0e8a16"
  description: "Issues or PRs related to Taskfile automation scripts."
- name: "area/terraform"
  color: "0e8a16"
  description: "Issues or PRs related to Terraform infrastructure code."
- name: "beginner-friendly"
  color: "0e8a16"
  description: "Good first issue for people wanting to contribute to the project."
- name: "breaking-change"
  color: "ee0701"
  description: "A breaking change for existing users."
- name: "bug"
  color: "d73a4a"
  description: "Something is not working as expected."
- name: "bugfix"
  color: "ee0701"
  description: "Inconsistencies or issues which will cause a problem for users or implementors."
- name: "ci"
  color: "1d76db"
  description: "Work that improves the continue integration."
- name: "cluster/main"
  color: "ffc300"
  description: "Issues or PRs affecting the main Kubernetes cluster."
- name: "cluster/storage"
  color: "ffc300"
  description: "Issues or PRs affecting the storage-focused Kubernetes cluster."
- name: "community"
  color: "370fb2"
  description: "Issues or PRs submitted by community members requiring special attention."
- name: "dependencies"
  color: "1d76db"
  description: "Upgrade or downgrade of project dependencies."
- name: "documentation"
  color: "0052cc"
  description: "Solely about the documentation of the project."
- name: "enhancement"
  color: "1d76db"
  description: "Enhancement of the code, not introducing new features."
- name: "grammar"
  color: "5319e7"
  description: "ShellSpec syntax that parses incorrectly or is not supported by the grammar."
- name: "hacktoberfest"
  color: "fbca04"
  description: "Issues/PRs are participating in the Hacktoberfest."
- name: "hacktoberfest-accepted"
  color: "fbca04"
  description: "Issues/PRs are participating in the Hacktoberfest."
- name: "help-wanted"
  color: "0e8a16"
  description: "We need some extra helping hands or expertise in order to resolve this."
- name: "hold"
  color: "ee0701"
  description: "Work is blocked or waiting for further input before proceeding."
- name: "in-progress"
  color: "fbca04"
  description: "Issue is currently being resolved by a developer."
- name: "incomplete"
  color: "fef2c0"
  description: "Marks a PR or issue that is missing information."
- name: "invalid"
  color: "fef2c0"
  description: "Marks a PR or issue that is missing information."
- name: "javascript"
  color: "168700"
  description: "Pull requests that update javascript code"
- name: "maintenance"
  color: "2af79e"
  description: "Generic maintenance tasks."
- name: "major"
  color: "b60205"
  description: "This PR causes a major version bump in the version number."
- name: "minor"
  color: "0e8a16"
  description: "This PR causes a minor version bump in the version number."
- name: "new-feature"
  color: "0e8a16"
  description: "New features or options."
- name: "no-stale"
  color: "fef2c0"
  description: "This issue or PR is exempted from the stable bot."
- name: "performance"
  color: "1d76db"
  description: "Improving performance, not introducing new features."
- name: "priority-critical"
  color: "ee0701"
  description: "This should be dealt with ASAP. Not fixing this issue would be a serious error."
- name: "priority-high"
  color: "b60205"
  description: "After critical issues are fixed, these should be dealt with before any further issues."
- name: "priority-low"
  color: "e4ea8a"
  description: "Nice addition, maybe... someday..."
- name: "priority-medium"
  color: "0e8a16"
  description: "This issue may be useful, and needs some attention."
- name: "refactor"
  color: "1d76db"
  description: "Improvement of existing code, not introducing new features."
- name: "renovate/ansible"
  color: "027fa0"
  description: "Automated dependency updates for Ansible roles and collections."
- name: "renovate/container"
  color: "027fa0"
  description: "Automated updates for container images and tags."
- name: "renovate/github-action"
  color: "027fa0"
  description: "Automated updates for GitHub Actions and workflows."
- name: "renovate/github-release"
  color: "027fa0"
  description: "Automated updates based on new GitHub releases."
- name: "renovate/grafana-dashboard"
  color: "027fa0"

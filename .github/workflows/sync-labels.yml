---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Sync Labels

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/labels.yml"
      - ".github/workflows/sync-labels.yml"
  schedule:
    - cron: "34 5 * * *" # Run every day at 05:34 AM UTC
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  labels:
    name: ♻️ Sync Labels
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read # required to read the labels definition
      issues: write # required to create and update repository labels

    steps:
      - name: ⤵️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⤵️ Sync Latest Labels Definitions
        uses: ivuorinen/actions/sync-labels@9a311175b62e4871d83e682bf2e772d99e6d6f44 # v2026.10.23

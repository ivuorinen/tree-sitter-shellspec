---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # required to check out the repository

    strategy:
      matrix:
        node-version: [22, 24]
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache Node.js dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-npm
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-

      # Plain `npm ci`: a lockfile that drifted from package.json fails the job instead of
      # being re-resolved by a fallback install.
      - name: Install Dependencies
        run: npm ci
        shell: bash

      # src/scanner.c is derived from tree-sitter-bash's scanner. Its TokenType enum must list
      # the external tokens in the same order as the pinned tree-sitter-bash grammar.
      # Whitespace is stripped because the local copy is re-indented to 2 spaces.
      - name: Verify Scanner Token Enum Matches tree-sitter-bash
        run: |
          enum_tokens() { sed -n '/^enum TokenType/,/^};/p' "$1" | tr -d ' \t'; }
          diff <(enum_tokens node_modules/tree-sitter-bash/src/scanner.c) <(enum_tokens src/scanner.c)
        shell: bash

      # Always regenerate: a cached src/parser.c keyed without the lockfile could hand the
      # tests a parser built by a different tree-sitter-cli or tree-sitter-bash version.
      - name: Generate Grammar
        run: npm run generate
        shell: bash

      # Fails when grammar.js changed but the committed src/ output was not regenerated,
      # so CI never tests (or releases) a parser that differs from the committed one.
      - name: Verify Committed Generated Files
        run: git diff --exit-code -- src/
        shell: bash

      - name: Test Parser with Sample Code
        run: |
          npm run build

          cat << 'EOF' > test_sample.shellspec
          #!/usr/bin/env shellspec

          Describe 'Calculator'
            Include ./lib/calculator.sh

            Before 'setup_calculator'
            After 'cleanup_calculator'

            Context 'when adding numbers'
              It 'adds two positive numbers'
                When call add 2 3
                The output should eq 5
              End

              It 'handles zero'
                When call add 0 5
                The output should eq 5
              End
            End

            Context 'when input is invalid'
              Skip if "validation not implemented" ! command -v validate

              It 'handles empty input'
                When call add "" ""
                The status should be failure
              End
            End
          End

          It 'works without describe block'
            When call echo "test"
            The output should eq "test"
          End
          EOF

          npx tree-sitter parse test_sample.shellspec --quiet || {
            echo "❌ Parser failed on sample ShellSpec code"
            exit 1
          }
          echo "✅ Parser successfully handled sample code"
        shell: bash

      # Real-world ShellSpec files. `tree-sitter parse --quiet` exits non-zero on ERROR and
      # MISSING nodes alike; grepping the output for "ERROR" misses MISSING nodes.
      - name: Parse Real ShellSpec Spec Files
        run: |
          failed=0
          for f in test/spec/*.sh; do
            npx tree-sitter parse --quiet "$f" > /dev/null || { echo "❌ parse errors: $f"; failed=1; }
          done
          exit "$failed"
        shell: bash

      # test/spec/ is a copy of ShellSpec's tutorial `examples/`, which exercises each
      # construct in its simplest documented form. The framework's own regression suite
      # is harder and is where real usage lives: it once had 8 failing files that the
      # tutorial corpus could not surface (bracket test arguments, `When I run`,
      # `Skip "reason" if`, `Include` with arguments, multi-argument `Data`, `<>`).
      # Pinned to a tag on purpose — a moving ref would let an upstream commit turn
      # this build red on its own.
      - name: Parse the upstream ShellSpec suite
        env:
          SHELLSPEC_REF: "0.28.1"
        run: |
          git clone --depth 1 --branch "$SHELLSPEC_REF" \
            https://github.com/shellspec/shellspec .tmp-shellspec
          failed=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            npx tree-sitter parse --quiet "$f" > /dev/null || { echo "❌ parse errors: $f"; failed=1; }
          done <<EOF
          $(find .tmp-shellspec/spec .tmp-shellspec/examples -name '*.sh' | sort)
          EOF
          echo "parsed $count upstream files"
          rm -rf .tmp-shellspec
          exit "$failed"
        shell: bash

  coverage:
    name: 📊 Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    permissions:
      contents: read # required to check out the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Cache Node.js dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-24-
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: Test Coverage Analysis
        id: coverage
        run: |
          echo "## Test Coverage Report" > coverage_report.md
          echo "" >> coverage_report.md

          # Run tests and capture output with exit code
          set +e  # Don't exit on test failure
          TEST_OUTPUT=$(npm test 2>&1)
          TEST_EXIT=$?
          set -e  # Re-enable exit on error

          # grep -c already prints 0 when nothing matches; `|| true` only swallows its exit 1
          TOTAL_TESTS=$(echo "$TEST_OUTPUT" | grep -cE "^\s+[0-9]+\." || true)
          PASSING_TESTS=$(echo "$TEST_OUTPUT" | grep -cE "^\s+[0-9]+\. ✓" || true)
          FAILING_TESTS=$(echo "$TEST_OUTPUT" | grep -cE "^\s+[0-9]+\. ✗" || true)

          {
            echo "- **Total Tests:** $TOTAL_TESTS"
            echo "- **Passing:** $PASSING_TESTS ✅"
            echo "- **Failing:** $FAILING_TESTS ❌"
          } >> coverage_report.md

          if [ "$TOTAL_TESTS" -gt 0 ]; then
            COVERAGE_PERCENT=$(( (PASSING_TESTS * 100) / TOTAL_TESTS ))
            echo "- **Coverage:** $COVERAGE_PERCENT%" >> coverage_report.md
          else
            COVERAGE_PERCENT=0
          fi

          {
            echo ""
            echo "### Test Files"
          } >> coverage_report.md
          echo "$TEST_OUTPUT" | grep -E "^[[:space:]]+[A-Za-z0-9._/\\-]+:" | sed 's/^/- /' >> coverage_report.md

          cat coverage_report.md

          # Set outputs
          {
            echo "total-tests=$TOTAL_TESTS"
            echo "passing-tests=$PASSING_TESTS"
            echo "coverage-percent=$COVERAGE_PERCENT"
          } >> "$GITHUB_OUTPUT"

          # Validate test coverage requirements
          if [ "${TOTAL_TESTS:-0}" -lt 115 ]; then
            echo "❌ Expected at least 115 tests, found ${TOTAL_TESTS:-0}"
            exit 1
          fi

          if [ "${FAILING_TESTS:-0}" -gt 0 ] || [ "$TEST_EXIT" -ne 0 ]; then
            echo "❌ Found ${FAILING_TESTS:-0} failing tests or test runner failed (exit code: $TEST_EXIT)"
            exit 1
          fi

          echo "✅ Test coverage is acceptable: $PASSING_TESTS/$TOTAL_TESTS tests passing ($COVERAGE_PERCENT%)"
        shell: bash

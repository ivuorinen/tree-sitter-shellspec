---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# Every step runs a task from mise.toml or .mise/tasks/, so `mise run <task>` reproduces
# it locally. mise installs the toolchain pinned there; Go comes from go.mod.
env:
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: v2026.10.21

jobs:
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # required to check out the repository

    strategy:
      matrix:
        node-version: [22, 24]
      fail-fast: false

    # Job-level, so mise-action and every `mise run` step use the matrix node; every
    # other tool keeps its mise.toml pin.
    env:
      MISE_NODE_VERSION: ${{ matrix.node-version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The default cache key ignores MISE_NODE_VERSION, so without the per-leg prefix both
      # legs would share one cache entry and one of them would always miss.
      - name: Setup mise (node ${{ matrix.node-version }})
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: ${{ env.MISE_VERSION }}
          cache_key_prefix: mise-v1-node${{ matrix.node-version }}

      # Plain `npm ci`: a lockfile that drifted from package.json fails the job instead of
      # being re-resolved by a fallback install.
      - name: Install Dependencies
        run: mise run install

      - name: Verify Scanner Token Enum Matches tree-sitter-bash
        run: mise run check:scanner

      # Always regenerate: a cached src/parser.c could hand the tests a parser built by a
      # different tree-sitter CLI or tree-sitter-bash version.
      - name: Generate Grammar
        run: mise run generate

      - name: Verify Committed Generated Files
        run: mise run check:generated

      - name: Run Tests and Check the Test Count
        run: mise run test:count

      - name: Parse Real ShellSpec Spec Files
        run: mise run test:spec

      - name: Parse the upstream ShellSpec suite
        run: mise run test:upstream

  # The corpus tests run through the tree-sitter CLI's own runtime, so they cannot catch
  # a binding whose declared runtime is too old for the grammar's ABI. That gap is not
  # hypothetical: parser.c targets ABI 15, and go-tree-sitter v0.24.0 tops out at 14.
  # These steps load the built grammar through each language's real runtime, which is
  # the only way that class of breakage surfaces.
  bindings:
    name: 🔌 Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    permissions:
      contents: read # required to check out the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Install Dependencies
        run: mise run install

      - name: Node, Python and Go bindings
        run: mise run test:bindings

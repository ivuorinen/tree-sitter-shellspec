---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 1 * * 0"
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read # required by CodeQL to read workflow run metadata
      contents: read # required to check out the repository
      packages: read # required to read packages during analysis
      security-events: write # required to upload CodeQL results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
          - language: javascript
          # The shipped C scanner (src/scanner.c) and parser; build-mode none needs no compile step.
          # `cpp`, not CodeQL's newer `c-cpp`: the wrapper action validates the language against
          # `java|csharp|cpp|c|go|swift|kotlin` and rejects `c-cpp` before CodeQL ever starts.
          - language: cpp
            build-mode: none
    steps:
      - name: CodeQL Analysis
        uses: ivuorinen/actions/codeql-analysis@6a8c40d9c5ff01b901d382b0ef86d432215aae2a # v2026.09.09
        with:
          language: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          config-file: .github/codeql/codeql-config.yml

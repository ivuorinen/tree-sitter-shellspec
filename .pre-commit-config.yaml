---
# Generated parser files must stay byte-identical to `npm run generate` output (CI diffs them),
# so no fixer hook may touch them.
exclude: ^src/(parser\.c|grammar\.json|node-types\.json|tree_sitter/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=auto]
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [-c, .markdownlint.json, --fix]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ["-shellcheck="]

  - repo: https://github.com/bridgecrewio/checkov.git
    rev: "3.3.29"
    hooks:
      - id: checkov
        args:
          - "--quiet"

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker

  # Prettier has no maintained hook repo (pre-commit/mirrors-prettier is archived).
  # pretty-quick picks the files itself, so prek passes none. The commit hook formats
  # staged files only and leaves the index to prek; outside --staged, pretty-quick also
  # formats untracked files. `npm run format` runs the manual-stage hook on every file
  # changed since main.
  - repo: local
    hooks:
      - id: pretty-quick
        name: pretty-quick
        entry: pretty-quick --staged --no-restage
        language: node
        additional_dependencies: [pretty-quick@4.2.2]
        pass_filenames: false
      - id: pretty-quick-branch
        name: pretty-quick (changed since main)
        entry: pretty-quick --branch main
        language: node
        additional_dependencies: [pretty-quick@4.2.2]
        pass_filenames: false
        stages: [manual]
